name: Build, Test & Publish Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Build Docker image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ghcr.io/gunnhil25/rent_app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start stack and smoke-test container
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health | grep -q '"database":"connected"'; then
              echo "Healthcheck passed!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Healthcheck timed out"
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/ | grep -q "CoreNest"
          echo "Frontend check passed!"

      - name: Tear down test stack
        if: always()
        run: docker compose down -v

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
